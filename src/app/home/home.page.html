<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Blank </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">

    <ion-button (click)="toggleCamera(video, dogEars, dogNose)" [disabled]="cameraState() === 'opening'">
      @if (cameraState() === 'opening') { 
        Opening Camera… 
      } @else if (cameraState() === 'open') { 
        Close Camera 
      } @else {
        Open Camera 
      }
    </ion-button>

    @if (cameraError()) {
    <p role="alert">{{ cameraError() }}</p>
    }

    <div class="camera-preview" [hidden]="cameraState() !== 'open'">
      <video #video muted playsinline aria-label="Live camera preview"></video>
      <img #dogEars class="dog-ears" src="assets/dog-ears.svg" alt="" hidden />
      <img #dogNose class="dog-nose" src="assets/dog-nose.svg" alt="" hidden />
    </div>
  </div>
</ion-content>
