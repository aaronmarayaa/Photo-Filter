<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Camera</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div id="container">
    <div class="camera-preview" [class.camera-off]="cameraState() !== 'open'">
      <video #video muted playsinline aria-label="Live camera preview"></video>
      <img #dogEars class="dog-ears" src="assets/dog-ears.svg" alt="" hidden />
      <img #dogNose class="dog-nose" src="assets/dog-nose.svg" alt="" hidden />
    </div>
    <div class="buttons">
      <a class="photos-link" routerLink="/photos" aria-label="Open photo list">
        <ion-icon name="images-outline" aria-hidden="true" [class.photo-saved]="photoSaveState() === 'saved'"></ion-icon>
      </a>
      <ion-button
        class="capture-button"
        shape="round"
        aria-label="Capture photo"
        [disabled]="cameraState() !== 'open' || photoSaveState() === 'saving'"
        (click)="capturePhoto()"
      >
        <ion-icon slot="icon-only" name="camera-outline" aria-hidden="true"></ion-icon>
      </ion-button>
      <ion-button class="reverse-button" fill="clear" disabled aria-label="Reverse camera">
        <ion-icon slot="icon-only" name="camera-reverse-outline" aria-hidden="true"></ion-icon>
      </ion-button>
    </div>

    <div role="status">
      @switch (photoSaveState()) {
        @case ('saving') {
          Adding photo…
        }
        @case ('saved') {
          Photo added to the list.
        }
        @case ('error') {
          Couldn't add the photo to the list. Try again.
        }
      }
    </div>

    @if (cameraError()) {
      <p role="alert">{{ cameraError() }}</p>
      <ion-button fill="clear" (click)="openCamera()">Retry camera</ion-button>
    }
  </div>
</ion-content>
