<ion-header>
  <ion-toolbar>
    <ion-title>Create Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" id="container">
  <form class="register-form" #registerForm="ngForm" (ngSubmit)="submit()">
    <ion-input
      name="username"
      label="Username"
      labelPlacement="stacked"
      fill="outline"
      autocomplete="username"
      autocapitalize="off"
      [(ngModel)]="username"
      [readonly]="submitting()"
      required
    ></ion-input>

    <ion-input
      #passwordInput
      name="password"
      label="Password"
      labelPlacement="stacked"
      fill="outline"
      type="password"
      autocomplete="new-password"
      helperText="Use 8 to 48 characters. Accented letters and emoji can count as more than one."
      [(ngModel)]="password"
      [readonly]="submitting()"
      required
    >
      <ion-button
        slot="end"
        type="button"
        fill="clear"
        [attr.aria-label]="passwordInput.type === 'password' ? 'Show password' : 'Hide password'"
        (click)="togglePassword(passwordInput)"
      >
        <ion-icon
          slot="icon-only"
          [name]="passwordInput.type === 'password' ? 'eye-outline' : 'eye-off-outline'"
        ></ion-icon>
      </ion-button>
    </ion-input>

    <ion-input
      #confirmInput
      name="confirmPassword"
      label="Confirm Password"
      labelPlacement="stacked"
      fill="outline"
      type="password"
      autocomplete="new-password"
      [(ngModel)]="confirmPassword"
      [readonly]="submitting()"
      required
    >
      <ion-button
        slot="end"
        type="button"
        fill="clear"
        [attr.aria-label]="confirmInput.type === 'password' ? 'Show confirm password' : 'Hide confirm password'"
        (click)="togglePassword(confirmInput)"
      >
        <ion-icon
          slot="icon-only"
          [name]="confirmInput.type === 'password' ? 'eye-outline' : 'eye-off-outline'"
        ></ion-icon>
      </ion-button>
    </ion-input>

    @if (warning()) {
    <p class="warning" role="alert">{{ warning() }}</p>
    }

    <ion-button type="submit" expand="block" [disabled]="submitting() || registerForm.invalid">
      {{ submitting() ? 'Creating account…' : 'Create Account' }}
    </ion-button>
    <ion-button routerLink="/login" routerDirection="back" expand="block" fill="outline" [disabled]="submitting()">
      Back to Log In
    </ion-button>
  </form>
</ion-content>
