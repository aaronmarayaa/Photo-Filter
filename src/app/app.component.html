<ion-app>
  <ion-split-pane contentId="main-content" [disabled]="!signedIn()">
    <ion-menu contentId="main-content" type="overlay" [disabled]="!signedIn()">
      <ion-header>
        <ion-toolbar>
          <ion-title>Menu</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <nav aria-label="Main navigation">
          <ion-list lines="none">
            <ion-menu-toggle [autoHide]="false">
              <ion-item
                routerLink="/home"
                routerDirection="root"
                routerLinkActive="selected"
                ariaCurrentWhenActive="page"
                [detail]="false"
              >
                <ion-label>Camera</ion-label>
              </ion-item>
            </ion-menu-toggle>
            <ion-menu-toggle [autoHide]="false">
              <ion-item
                routerLink="/photos"
                routerDirection="root"
                routerLinkActive="selected"
                ariaCurrentWhenActive="page"
                [detail]="false"
              >
                <ion-label>Photos</ion-label>
              </ion-item>
            </ion-menu-toggle>
            <ion-item [button]="true" [detail]="false" [disabled]="loggingOut()" (click)="logOut()">
              <ion-label>Log Out</ion-label>
            </ion-item>
          </ion-list>
        </nav>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
